name: Quality checks
on:
  pull_request:
  push:
    branches: [develop]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: npm ci
      - run: npm run lint:check
      - run: npm run build
      - run: npm run test:coverage
