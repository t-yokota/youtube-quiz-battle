name: Quality checks
on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - run: npm ci
      - run: npm run lint:check
      - run: npm run type-check
      - run: npm run test:coverage
      - run: npm run build-only
        env:
          VITE_GA_MEASUREMENT_ID: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'G-JZTD11WD9E' || '' }}
      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
        with:
          name: site
          path: dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
      url: ${{ github.ref == 'refs/heads/main' && 'https://youtube-quiz-battle.pages.dev/' || 'https://develop.youtube-quiz-battle.pages.dev/' }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v2
        with:
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: site
          path: dist
      - name: Verify Cloudflare production branch
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --input-type=module <<'NODE'
          const { CLOUDFLARE_API_TOKEN: token, CLOUDFLARE_ACCOUNT_ID: account } = process.env;
          if (!token || !account) throw new Error('Cloudflare credentials are missing');
          const response = await fetch(
            `https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(account)}/pages/projects/youtube-quiz-battle`,
            { headers: { Authorization: `Bearer ${token}` }, signal: AbortSignal.timeout(30000) },
          );
          if (!response.ok) throw new Error(`Cloudflare project check failed: HTTP ${response.status}`);
          const body = await response.json();
          if (!body.success || body.result?.production_branch !== 'main') {
            throw new Error('Set the Cloudflare Pages production branch to main before deploying');
          }
          NODE
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=youtube-quiz-battle --branch=${{ github.ref_name }}
